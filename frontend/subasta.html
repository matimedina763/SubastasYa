<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Crear Subasta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <header class="header text-center">
            <img class="logo" src="https://images.unsplash.com/photo-placeholder" alt="Logo">
            <span class="slogan">Compra y Gana ¡Ya!</span>
            <hr>
            <a href="index.html" class="btn btn-secondary">← Volver al catálogo</a>
            <hr>
        </header>

        <main>
            <h2 class="mb-4 text-center">Publicar una subasta</h2>

            <div id="alertaCrear" class="alert alert-danger d-none"></div>
            <div id="exitoCrear" class="alert alert-success d-none"></div>

            <form id="formCrearSubasta">
                <div class="mb-3">
                    <label class="form-label">¿Quién publica?</label>
                    <select id="vendedorId" class="form-select">
                        <option value="1">Vendedor</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" id="titulo" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">URL de imagen (opcional)</label>
                    <input type="text" id="urlImagen" class="form-control" placeholder="https://...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select id="categoriaId" class="form-select">
                        <option value="1">Tecnología</option>
                        <option value="2">Coleccionables</option>
                        <option value="3">Indumentaria</option>
                        <option value="4">Vehículos</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Precio base</label>
                        <input type="number" id="precioBase" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Incremento mínimo</label>
                        <input type="number" id="incrementoMinimo" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de inicio</label>
                        <input type="datetime-local" id="fechaInicio" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de fin</label>
                        <input type="datetime-local" id="fechaFin" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Publicar subasta</button>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="crear-subasta.js"></script>
</body>
</html>
