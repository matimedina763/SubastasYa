<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Billetera Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-subastaya navbar-expand-md">
        <div class="container-fluid px-3">
            <a class="navbar-brand" href="index.html">
                <img src="assets/img/logo.jpeg" alt="SubastaYa">
                SubastaYa
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a class="nav-link" href="mis_subastas.html">Mis subastas</a>
                <a class="nav-link" href="billetera.html">Mi billetera</a>
                <a class="btn-crear" href="subasta.html">Crear subasta</a>
            </div>
        </div>
    </nav>

    <div class="contenido">
        <main>
            <h2 class="mb-4 text-center">Mi Billetera Virtual</h2>

            <div class="mb-4">
                <label class="form-label">¿Quién sos?</label>
                <select id="selectUsuario" class="form-select w-auto mx-auto">
                    <option value="1">Vendedor</option>
                    <option value="2">Comprador 1</option>
                    <option value="3">Comprador 2</option>
                    <option value="4">Sin Fondos</option>
                </select>
            </div>

            <!-- Resumen de saldos -->
            <section class="mb-4">
                <h2 class="h4 mb-3">Tus saldos</h2>
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm card-saldo">
                            <div class="card-body text-center">
                                <h3>Total</h3>
                                <p id="saldoTotal" class="fs-3 fw-bold">$0,00</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm card-saldo">
                            <div class="card-body text-center">
                                <h3>Retenido</h3>
                                <p id="saldoRetenido" class="fs-3 fw-bold">$0,00</p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm card-saldo disponible">
                            <div class="card-body text-center">
                                <h3>Disponible</h3>
                                <p id="saldoDisponible" class="fs-3 fw-bold">$0,00</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Carga de saldo -->
            <section class="mb-4">
                <h2 class="h4 mb-3">Carga de saldo simulada</h2>
                <form id="formDeposito">
                    <div class="row align-items-end g-3">
                        <input
                            type="number"
                            id="montoDeposito"
                            class="form-control"
                            min="1"
                            step="0.01"
                            placeholder="Monto a acreditar"
                            required
                        >
                        <button type="submit" class="btn btn-primary w-100">Cargar</button>
                    </div>
                </form>
            </section>

            <!-- Historial de movimientos -->
            <section class="mb-4">
                <h2 class="h4 mb-3">Mis movimientos</h2>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Monto</th>
                                <th>Fecha</th>
                                <th>Subasta</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMovimientos">
                            <tr>
                                <td colspan="4" class="text-center">No hay movimientos por el momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/billetera.js"></script>
</body>
</html>
