<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Mis Subastas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <nav class="navbar navbar-subastaya navbar-expand-md">
            <div class="container-fluid px-3">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/logo.jpeg" alt="SubastaYa">
                    SubastaYa
                </a>
                <div class="d-flex gap-3 align-items-center">
                    <a class="nav-link" href="mis_subastas.html">Mis subastas</a>
                    <a class="nav-link" href="billetera.html">Mi billetera</a>
                    <a class="btn-crear" href="subasta.html">Crear subasta</a>
                </div>
            </div>
        </nav>

        <main>
            <div class="mb-4">
                <label class="form-label">¿Quién sos?</label>
                <select id="selectUsuario" class="form-select">
                    <option value="1">Vendedor</option>
                    <option value="2">Comprador 1</option>
                    <option value="3">Comprador 2</option>
                    <option value="4">Sin Fondos</option>
                </select>
            </div>

            <section class="mb-5">
                <h2>Mis Pujas</h2>
                <div id="listaMisPujas" class="table-responsive">
                    <p class="text-muted">Cargando...</p>
                </div>
            </section>

            <section>
                <h2>Mis Publicaciones</h2>
                <div id="listaMisPublicaciones" class="table-responsive">
                    <p class="text-muted">Cargando...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/mis-subastas.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
