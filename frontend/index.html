<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Ventas y Compras en Línea: Compra y Gana ¡Ya!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <nav class="navbar navbar-subastaya navbar-expand-md">
            <div class="container-fluid px-3">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/logo.jpeg" alt="SubastaYa">
                    SubastaYa
                </a>
                <div class="d-flex gap-3 align-items-center">
                    <a class="nav-link" href="mis_subastas.html">Mis Subastas</a>
                    <a class="nav-link" href="billetera.html">Mi Billetera</a>
                    <a class="btn-crear" href="subasta.html">Crear Subasta</a>
                </div>
            </div>
        </nav>

        <div class="hero">
            <h1>Ofertá. Superá. Ganá.</h1>
            <p>Subastas en tiempo real, con pujas seguras y fondos protegidos.</p>
        </div>
        
        <main>
            <section class="subastas">
                <h2 class="mb-4">Subastas Activas</h2>
                <div id="lista" class="row"></div>
            </section>

            <section class="subastas mt-5">
                <h2 class="mb-4">Subastas Finalizadas / Desiertas</h2>
                <div id="listaCerradas" class="row"></div>
            </section>
        </main>
    </div>
        <!-- Modal para pujar -->
    <div class="modal fade" id="modalPujar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Realizar puja</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <div id="alertaPuja" class="alert alert-danger d-none"></div>

            <div class="mb-3">
            <label class="form-label">¿Quién sos?</label>
            <select id="selectComprador" class="form-select">
                <option value="2">Comprador 1</option>
                <option value="3">Comprador 2</option>
                <option value="4">Sin Fondos (para probar rechazo)</option>
            </select>
            </div>

            <div class="mb-3">
            <label class="form-label">Monto a ofertar</label>
            <input type="number" id="inputMonto" class="form-control" placeholder="Ej: 46000">
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" id="btnConfirmarPuja" class="btn btn-primary">Confirmar puja</button>
        </div>
        </div>
    </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script> 
    <script src="js/toast.js"></script>
    <script src="js/app.js"></script>   

</body>
</html>
