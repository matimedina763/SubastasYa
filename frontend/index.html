<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubastaYa - Ventas y Compras en Línea: Compra y Gana ¡Ya!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <header class="header text-center">
            <img class="logo" src="https://images.unsplash.com/photo-1554629947-3343fcda6887?ixlib=rb-4.0.0&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1000&q=80" alt="Logo">
            <span class="slogan">Compra y Gana ¡Ya!</span>
            <hr> 
            <class="btn-group" role="group" aria-label="Basic example">
                <a href="subasta.html" class="btn btn-success">Crear Subasta</a>
                <a href="mis_subastas.html" class="btn btn-info">Mis Subastas</a>
            </class>
            <hr>
        </header>
        
        <main>
            <section class="subastas">
                <h2 class="mb-4">Subastas Activas</h2>
                <div id="lista" class="row">
                    <p>Cargando . . .</p>
                </div>     
            </section>
        </main>
    </div>
        <!-- Modal para pujar -->
    <div class="modal fade" id="modalPujar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Realizar puja</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
            <div id="alertaPuja" class="alert alert-danger d-none"></div>

            <div class="mb-3">
            <label class="form-label">¿Quién sos?</label>
            <select id="selectComprador" class="form-select">
                <option value="2">Comprador 1</option>
                <option value="3">Comprador 2</option>
                <option value="4">Sin Fondos (para probar rechazo)</option>
            </select>
            </div>

            <div class="mb-3">
            <label class="form-label">Monto a ofertar</label>
            <input type="number" id="inputMonto" class="form-control" placeholder="Ej: 46000">
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" id="btnConfirmarPuja" class="btn btn-primary">Confirmar puja</button>
        </div>
        </div>
    </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>    

</body>
</html>
